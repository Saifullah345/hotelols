name: CI/CD — Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint

  # ── Build & Deploy (main branch only) ────────────────────────────────────
  deploy:
    name: Build & Deploy
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone bundle
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${{ secrets.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}
          NEXT_PUBLIC_PADDLE_ENV: ${{ secrets.NEXT_PUBLIC_PADDLE_ENV }}

      - name: Copy static assets into standalone
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Create deployment tarball
        run: tar -czf hotelos-deploy.tar.gz -C .next/standalone .

      - name: Upload tarball to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: hotelos-deploy.tar.gz
          target: /home/bookqayam/deploys/

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            NODE=/home/bookqayam/.nvm/versions/node/v24.20.0/bin/node
            PM2=/home/bookqayam/.nvm/versions/node/v24.20.0/bin/pm2

            # Extract into a fresh directory
            rm -rf ~/hotelos-new
            mkdir -p ~/hotelos-new
            tar -xzf ~/deploys/hotelos-deploy.tar.gz -C ~/hotelos-new

            # Atomic swap: keep old as rollback
            rm -rf ~/hotelos-old
            [ -d ~/hotelos ] && mv ~/hotelos ~/hotelos-old
            mv ~/hotelos-new ~/hotelos

            # Preserve the ecosystem config that holds secrets
            [ -f ~/hotelos-old/ecosystem.config.js ] && \
              cp ~/hotelos-old/ecosystem.config.js ~/hotelos/ecosystem.config.js

            # Reload PM2 with new build
            $PM2 reload hotelos --update-env 2>/dev/null || \
              $PM2 start ~/hotelos/ecosystem.config.js

            $PM2 save
            echo "=== Deploy complete ==="
            $PM2 status hotelos
